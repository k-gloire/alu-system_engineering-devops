<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Lost in space</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at top, #1b2a6b, #05071a); color: #fff; font-family: Arial, sans-serif; text-align: center; overflow: hidden; }
  h1 { font-size: 9rem; margin: 0; letter-spacing: 1rem; text-shadow: 0 0 30px #7aa2ff; }
  p { font-size: 1.4rem; margin: 10px 0; }
  .rocket { font-size: 5rem; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-30px) rotate(10deg); } }
  a { margin-top: 25px; padding: 12px 28px; background: #7aa2ff; color: #05071a; text-decoration: none; border-radius: 30px; font-weight: bold; }
  a:hover { background: #fff; }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 2s infinite; }
  @keyframes twinkle { 50% { opacity: 0.2; } }
</style>
</head>
<body>
  <div class="star" style="top:10%;left:15%;width:4px;height:4px"></div>
  <div class="star" style="top:25%;left:80%;width:3px;height:3px"></div>
  <div class="star" style="top:70%;left:25%;width:5px;height:5px"></div>
  <div class="star" style="top:85%;left:70%;width:3px;height:3px"></div>
  <div class="rocket">🚀</div>
  <h1>404</h1>
  <p>Ceci n'est pas une page</p>
  <p>Looks like this page drifted off into space.</p>
  <a href="/">Take me home</a>
</body>
</html>
